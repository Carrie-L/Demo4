# 每次推送或 PR 验证单元测试、Debug、混淆 Release 和 Lint，并保存报告与 Debug APK。
name: Android validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests, debug and minified release builds, lint
        run: ./gradlew :widget-guide:testDebugUnitTest :app:assembleDebug :app:assembleRelease :app:lintDebug :widget-guide:lintDebug --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-reports
          path: |
            widget-guide/build/reports/
            app/build/reports/
      - uses: actions/upload-artifact@v4
        with:
          name: demo4-debug-apk
          path: app/build/outputs/apk/debug/*.apk
